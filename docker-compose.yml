services:
  postgres-db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dbname
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      

  backend:
    build: ./backend
    container_name: developers-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres-db:5432/dbname
    volumes:
      - ./backend:/app
    depends_on:
      - postgres-db

  frontend:
    build: ./frontend
    container_name: developers-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:



